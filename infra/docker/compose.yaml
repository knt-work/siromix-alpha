name: siromix
services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:d2ef61f42ef767baa5a1475393303cc235bcd92febd9d7014eddb48b41f3bad0
    environment:
      POSTGRES_DB: siromix
      POSTGRES_USER: siromix_app
      POSTGRES_PASSWORD: local-only-password
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      {
        test: ["CMD-SHELL", "pg_isready -U siromix_app -d siromix"],
        interval: 5s,
        timeout: 3s,
        retries: 20,
      }
    networks: [data]
    volumes: [postgres-data:/var/lib/postgresql/data]
  temporal:
    image: temporalio/auto-setup:1.27.2
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: siromix_app
      POSTGRES_PWD: local-only-password
      POSTGRES_SEEDS: postgres
      BIND_ON_IP: 0.0.0.0
      TEMPORAL_ADDRESS: temporal:7233
    depends_on: { postgres: { condition: service_healthy } }
    ports: ["127.0.0.1:7233:7233"]
    healthcheck:
      {
        test:
          [
            "CMD",
            "temporal",
            "--address",
            "temporal:7233",
            "operator",
            "cluster",
            "health",
          ],
        interval: 5s,
        timeout: 10s,
        retries: 36,
        start_period: 60s,
      }
    networks: [data, workflow]
  temporal-ui:
    image: temporalio/ui:2.40.1
    environment: { TEMPORAL_ADDRESS: "temporal:7233" }
    depends_on: { temporal: { condition: service_healthy } }
    ports: ["127.0.0.1:8233:8080"]
    networks: [workflow]
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: siromix-local
      MINIO_ROOT_PASSWORD: local-minio-password-change-me
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    healthcheck:
      {
        test: ["CMD", "mc", "ready", "local"],
        interval: 5s,
        timeout: 3s,
        retries: 20,
      }
    networks: [storage]
    volumes: [minio-data:/data]
  clamav:
    image: clamav/clamav:1.4.3
    ports: ["127.0.0.1:3310:3310"]
    networks: [scanner]
networks:
  data: {}
  workflow: {}
  storage: {}
  scanner: {}
volumes:
  postgres-data: {}
  minio-data: {}
